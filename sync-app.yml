name: Sync app.py from upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kiko
        uses: actions/checkout@v4

      - name: Download upstream app.py
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/eooce/katabump-renew/main/app.py \
            -o /tmp/upstream_app.py

      - name: Compare app.py
        run: |
          if cmp -s /tmp/upstream_app.py app.py; then
            echo "app.py is already up to date."
            exit 0
          fi

          echo "New app.py detected."

      - name: Update app.py
        run: |
          cp /tmp/upstream_app.py app.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.py
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "sync app.py from upstream"
          git push
